services:

  postgres:
    image: postgres:16
    container_name: shopsphere-postgres

    environment:
      POSTGRES_DB: shopsphere_oltp
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_local

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere_oltp"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data: